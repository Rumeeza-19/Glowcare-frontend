<!DOCTYPE html>
<html>

<head>
    <title>GlowCare - Routine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>GlowCare</h1>

    <div class="form-box">

        <h2>My Skincare Routine</h2>

        <input type="number" id="userId" placeholder="User ID">

        <input type="text" id="name" placeholder="Routine Name">

        <input type="text" id="morningRoutine" placeholder="Morning Routine">

        <input type="text" id="nightRoutine" placeholder="Night Routine">

        <input type="text" id="status" placeholder="Status">

        <button onclick="addRoutine()">Add Routine</button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
